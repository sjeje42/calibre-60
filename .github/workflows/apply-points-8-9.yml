name: Apply points 8 and 9

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-points-8-9.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Apply compact mode and release packaging
        run: python3 scripts/apply_points_8_9.py
      - name: Commit generated changes
        run: |
          git config user.name "Jérôme"
          git config user.email "58558882+sjeje42@users.noreply.github.com"
          git add -A
          git commit -m "Add compact mode and release packaging"
          git push
