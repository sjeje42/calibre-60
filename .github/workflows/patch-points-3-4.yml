name: Apply points 3 and 4

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Patch main application
        run: python3 .github/patch_points_3_4.py
      - name: Commit patched application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.rs
          git rm .github/patch_points_3_4.py .github/workflows/patch-points-3-4.yml
          git commit -m "Add notifications and background tray mode"
          git push
