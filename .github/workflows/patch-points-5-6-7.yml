name: Apply points 5 6 7

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Patch main application
        run: python3 tools/patch_points_5_7.py

      - name: Commit patched application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.rs
          git rm tools/patch_points_5_7.py
          git rm .github/workflows/patch-points-5-6-7.yml
          git commit -m "Add custom presets lap stats and FR EN localization"
          git push
